# Training pipeline configuration
# All symbols must be uppercase ticker strings (e.g. ETH, BNB, SOL).
# Change these values to retarget the pipeline without touching source code.

# The asset the model will trade and generate labels for.
trading_symbol: ETH

# Assets used as input signal sources for feature engineering.
# The trading_symbol is included here so its own OHLCV data becomes a feature source.
signal_symbols:
  - ETH
  - BNB
  - SOL

# OHLCV bar interval (e.g. 1h, 4h, 1d).
timeframe: 1h

# Number of bars ahead to predict.
prediction_horizon_bars: 12
model_task: binary_long_cash

# Legacy directional threshold. binary_long_cash labels use:
# 2 * transaction_fee + backtest.return_buffer.
return_threshold: 0.01

# Historical date range for data collection as day offsets from today (UTC).
# -1 is yesterday, 0 is today. The end day is included by the pipeline.
start_date: -365
end_date: -1

# Chronological split fractions; must sum to 1.0.
split:
  train: 0.70
  validation: 0.15
  test: 0.15

# Simple backtest settings used for evaluation reports.
# all_in_long_cash treats BUY as long ETH, SELL as cash, and HOLD as keeping
# the previous portfolio state. transaction_fee is charged on executed turnover.
backtest:
  portfolio_mode: all_in_long_cash
  initial_position: 0
  transaction_fee: 0.001
  return_buffer: 0.005
  min_validation_cumulative_return: 0.10
  min_validation_exposure_ratio: 0.10
  min_validation_traded_bars: 100
  max_validation_drawdown: -0.85
  max_validation_turnover: 250.0

# Baseline model to use when model_candidates is omitted.
# Must match a key in the model registry.
model_type: RandomForestClassifier

# Hyper-parameters forwarded to the chosen model constructor.
model_params:
  n_estimators: 100
  random_state: 42
  n_jobs: -1

# Optional candidate set. When present, the pipeline trains all candidates on
# the chronological train split and selects the best validation performer.
model_selection_metric: f1_macro
model_candidates:
  - name: logistic_regression
    model_type: LogisticRegression
    model_params:
      max_iter: 1000
      random_state: 42
  - name: random_forest
    model_type: RandomForestClassifier
    model_params:
      n_estimators: 100
      random_state: 42
      n_jobs: -1
  - name: random_forest_balanced
    model_type: RandomForestClassifier
    model_params:
      n_estimators: 200
      class_weight: balanced
      random_state: 42
      n_jobs: -1
  - name: extra_trees_balanced
    model_type: ExtraTreesClassifier
    model_params:
      n_estimators: 300
      class_weight: balanced
      random_state: 42
      n_jobs: -1
  - name: gradient_boosting
    model_type: GradientBoostingClassifier
    model_params:
      n_estimators: 150
      learning_rate: 0.05
      max_depth: 3
      random_state: 42
  - name: hist_gradient_boosting
    model_type: HistGradientBoostingClassifier
    model_params:
      max_iter: 150
      learning_rate: 0.05
      l2_regularization: 0.01
      random_state: 42

# Root directory for all training run artifacts.
artifacts_dir: artifacts

# Feature engineering windows.
# All values are bar counts.  Defaults match the MVP spec; override as needed.
feature_config:
  return_windows: [1, 5, 20]
  ma_short_window: 7
  ma_long_window: 20
  volatility_window: 20
  volume_window: 20
  correlation_window: 20
