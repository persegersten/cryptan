name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      config_path:
        description: Training config path
        required: true
        default: config/training.yaml
      export_bundle_output:
        description: Output directory for the exported model bundle
        required: true
        default: dist/model_bundle

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  train-model:
    name: Train model
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      CRYPTAN_DATA_API_KEY: ${{ secrets.CRYPTAN_DATA_API_KEY }}
      CRYPTAN_DATA_API_SECRET: ${{ secrets.CRYPTAN_DATA_API_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train model
        run: |
          python -m src.pipeline.train_pipeline \
            --config "${{ inputs.config_path }}" \
            --export-bundle-output "${{ inputs.export_bundle_output }}"

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            artifacts/
            ${{ inputs.export_bundle_output }}/
          if-no-files-found: error
